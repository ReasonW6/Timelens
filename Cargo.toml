[workspace]
members = [
    "crates/timelens-app",
    "crates/timelens-collector",
    "crates/timelens-ipc",
    "crates/timelens-observer",
    "crates/timelens-storage",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
embed-resource = "3"
hex = "0.4.3"
prost = "0.14.4"
rusqlite = { version = "0.40.2", default-features = false, features = [
    "bundled-sqlcipher-vendored-openssl",
] }
slint = { version = "1.17.1", default-features = false, features = [
    "backend-winit",
    "compat-1-2",
    "renderer-software",
    "std",
] }
tempfile = "3.27.0"
thiserror = "2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }
zeroize = "1.8.2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
