<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timelens 积木</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Nunito:wght@500;600;700;800&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* Layout: chunky sticker sidebar with the mascot | page of hard-edged cards. The day is a tower of 5-minute blocks.
   Palette: lilac paper, ink outlines with hard offset shadows, candy app colors; butter yellow is the one accent. */
:root {
  --bg: #f1eeff; --dot: rgba(27,21,48,.09); --paper: #ffffff; --paper-2: #f8f6ff; --tint: #ebe6ff;
  --ink: #1b1530; --ink-2: #4b4466; --muted: #8b84a6; --edge: #1b1530;
  --butter: #ffd84d; --tomato: #ff6f59; --mint: #2fd69a; --grape: #a685ff;
  --a-vscode: #4f8dff; --a-figma: #a685ff; --a-edge: #22cdd2; --a-excel: #ffa25e; --a-feishu: #ff8fc6; --a-wechat: #2fd69a; --a-terminal: #8190ad; --a-music: #ffd84d;
  --sh: 4px 4px 0 var(--edge); --sh-sm: 2px 2px 0 var(--edge); --sh-lg: 7px 7px 0 var(--edge);
  --display: "Bricolage Grotesque", "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
  --fun: "ZCOOL KuaiLe", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
  --body: "Nunito", "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
  --bounce: cubic-bezier(.34,1.7,.5,1); --soft: cubic-bezier(.22,1,.36,1);
  --b: 2.5px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16131f; --dot: rgba(255,255,255,.06); --paper: #252036; --paper-2: #1e1a2c; --tint: #2f2944;
  --ink: #f5f2ff; --ink-2: #c4bddc; --muted: #8780a3; --edge: #050408;
  --butter: #ffd84d; --tomato: #ff7a66; --mint: #3ee0a6; --grape: #b597ff;
  --a-vscode: #6a9fff; --a-figma: #b597ff; --a-edge: #3bd9de; --a-excel: #ffad6e; --a-feishu: #ff9ccd; --a-wechat: #3ee0a6; --a-terminal: #95a3be; --a-music: #ffd84d;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #16131f; --dot: rgba(255,255,255,.06); --paper: #252036; --paper-2: #1e1a2c; --tint: #2f2944;
  --ink: #f5f2ff; --ink-2: #c4bddc; --muted: #8780a3; --edge: #050408;
  --butter: #ffd84d; --tomato: #ff7a66; --mint: #3ee0a6; --grape: #b597ff;
  --a-vscode: #6a9fff; --a-figma: #b597ff; --a-edge: #3bd9de; --a-excel: #ffad6e; --a-feishu: #ff9ccd; --a-wechat: #3ee0a6; --a-terminal: #95a3be; --a-music: #ffd84d;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; color: var(--ink); font: 600 14px/1.55 var(--body); background: var(--bg); background-image: radial-gradient(var(--dot) 1.4px, transparent 1.6px); background-size: 22px 22px; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--grape); outline-offset: 3px; border-radius: 10px; }
.num { font-variant-numeric: tabular-nums; }
.on-butter { color: #1b1530; }

.app { height: 100%; display: grid; grid-template-columns: 236px minmax(0,1fr); }
/* sidebar */
.side { display: flex; flex-direction: column; gap: 10px; padding: 18px 16px 18px 20px; min-height: 0; }
.buddy { position: relative; display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 10px; align-items: center; padding: 10px 12px 10px 8px; background: var(--paper); border: var(--b) solid var(--edge); border-radius: 22px; box-shadow: var(--sh); margin-bottom: 8px; }
.buddy svg { width: 74px; height: 74px; overflow: visible; cursor: pointer; }
.buddy .bod { transform-origin: 60px 104px; }
.buddy .bod.jump { animation: jump .7s var(--bounce); }
@keyframes jump { 0% { transform: scale(1,1); } 15% { transform: scale(1.15,.82); } 40% { transform: translateY(-16px) scale(.9,1.12); } 70% { transform: translateY(0) scale(1.08,.9); } 100% { transform: none; } }
.buddy .lid { transform-origin: 60px 34px; transform: scaleY(0); }
.buddy .lid.blink { animation: blink .22s ease-in-out; }
@keyframes blink { 50% { transform: scaleY(1); } }
.paused .buddy .lid { transform: scaleY(1); animation: none; }
.buddy .zz { opacity: 0; font: 800 15px var(--display); fill: var(--ink); }
.paused .buddy .zz { animation: zz 2.2s ease-in-out infinite; }
.paused .buddy .zz:nth-of-type(2) { animation-delay: 1.1s; }
@keyframes zz { 0% { opacity: 0; transform: translate(0,0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(10px,-18px); } }
.buddy .bulb { animation: bulb 1.4s steps(2) infinite; }
.paused .buddy .bulb { animation: none; fill: var(--muted); }
@keyframes bulb { 50% { fill: var(--paper); } }
.buddy-name { font: 400 19px/1.1 var(--fun); }
.buddy-say { font: 700 11.5px/1.4 var(--body); color: var(--ink-2); }
.nav { display: grid; gap: 8px; }
.nav-btn { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 16px; border: var(--b) solid transparent; font: 800 14.5px/1 var(--body); color: var(--ink-2); transition: transform .35s var(--bounce), box-shadow .2s, background .2s, border-color .2s; }
.nav-btn .ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--tint); border: var(--b) solid var(--edge); transition: transform .4s var(--bounce), background .2s; flex: none; }
.nav-btn .ic svg { width: 17px; height: 17px; }
.nav-btn:hover { color: var(--ink); }
.nav-btn:hover .ic { transform: rotate(-8deg) scale(1.08); }
.nav-btn[aria-current="page"] { background: var(--paper); border-color: var(--edge); box-shadow: var(--sh); color: var(--ink); transform: translate(-2px,-2px); }
.nav-btn[aria-current="page"] .ic { background: var(--butter); color: #1b1530; }
.side-foot { margin-top: auto; display: grid; gap: 10px; }
.rec-switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; background: var(--paper); border: var(--b) solid var(--edge); border-radius: 18px; box-shadow: var(--sh); font: 800 13.5px/1.2 var(--body); text-align: left; transition: transform .3s var(--bounce), box-shadow .2s; }
.rec-switch:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--edge); }
.rec-switch small { display: block; font: 600 11.5px/1.3 var(--body); color: var(--muted); }
.knob { width: 52px; height: 30px; border-radius: 99px; background: var(--mint); border: var(--b) solid var(--edge); position: relative; flex: none; transition: background .3s; }
.knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; border-radius: 50%; background: var(--paper); border: var(--b) solid var(--edge); transform: translateX(22px); transition: transform .5s var(--bounce); }
.paused .knob { background: var(--tint); }
.paused .knob::after { transform: none; }
.clock { font: 800 12px/1 var(--display); color: var(--muted); text-align: center; letter-spacing: .02em; }

/* page */
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.page { position: absolute; inset: 0; overflow: auto; padding: 22px 26px 40px 10px; scrollbar-width: thin; }
.page.enter { animation: deal .75s var(--bounce) both; }
.page.leave { animation: toss .3s ease-in both; pointer-events: none; }
@keyframes deal { from { opacity: 0; transform: translateY(40px) rotate(1.2deg) scale(.98); } }
@keyframes toss { to { opacity: 0; transform: translateY(-20px) rotate(-1deg) scale(.98); } }
.head { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 20px; margin-bottom: 20px; }
h1 { margin: 0; font: 400 40px/1.05 var(--fun); letter-spacing: .01em; text-wrap: balance; }
h1 .lat { font: 800 40px/1 var(--display); letter-spacing: -.02em; }
.tag { display: inline-block; padding: 4px 10px; border: var(--b) solid var(--edge); border-radius: 10px; background: var(--butter); color: #1b1530; font: 800 12px/1.2 var(--body); box-shadow: var(--sh-sm); transform: rotate(-4deg); vertical-align: 8px; margin-left: 8px; }
h2 { margin: 0; font: 400 19px/1.2 var(--fun); }
.sub { color: var(--muted); font: 700 12.5px/1.4 var(--body); }
.head-actions { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { height: 40px; padding-inline: 16px; display: inline-flex; align-items: center; gap: 8px; border: var(--b) solid var(--edge); border-radius: 14px; background: var(--paper); box-shadow: var(--sh); font: 800 13.5px/1 var(--body); white-space: nowrap; transition: transform .3s var(--bounce), box-shadow .15s; }
.btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--edge); }
.btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--edge); transition-duration: .05s; }
.btn svg { width: 16px; height: 16px; }
.btn-y { background: var(--butter); color: #1b1530; }
.btn-r { background: var(--tomato); color: #1b1530; }
.btn-sm { height: 32px; padding-inline: 12px; font-size: 12.5px; border-radius: 11px; box-shadow: var(--sh-sm); }
.card { background: var(--paper); border: var(--b) solid var(--edge); border-radius: 22px; box-shadow: var(--sh); padding: 18px 20px; min-width: 0; }
.week { display: flex; gap: 6px; }
.day { width: 42px; padding: 6px 0; border-radius: 12px; border: var(--b) solid var(--edge); background: var(--paper); display: grid; justify-items: center; font: 800 15px/1.1 var(--display); box-shadow: var(--sh-sm); transition: transform .35s var(--bounce); }
.day small { font: 700 10.5px/1 var(--body); color: var(--muted); }
.day:hover:not([disabled]) { transform: translateY(-3px) rotate(-3deg); }
.day[aria-pressed="true"] { background: var(--butter); color: #1b1530; }
.day[aria-pressed="true"] small { color: #1b1530; }
.day[disabled] { border-style: dashed; box-shadow: none; opacity: .45; cursor: default; }

/* tower */
.tl-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 22px; align-items: start; }
.tower-card { padding: 18px 20px 14px; }
.tower-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.total { font: 800 46px/1 var(--display); letter-spacing: -.03em; }
.total small { font-size: 20px; color: var(--ink-2); margin-left: 1px; }
.tower { display: grid; grid-template-columns: repeat(8, minmax(0,1fr)); gap: 10px; align-items: end; padding: 16px 4px 0; position: relative; }
.tower::after { content: ""; position: absolute; left: 0; right: 0; bottom: 18px; height: var(--b); background: var(--edge); border-radius: 2px; }
.col { display: grid; justify-items: center; gap: 14px; transition: opacity .35s, filter .35s; }
.col.out { opacity: .3; filter: grayscale(1); }
.stack { display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 1fr; gap: 4px; width: 100%; max-width: 64px; aspect-ratio: 2 / 6.2; direction: ltr; transform: scaleY(-1); }
.blk { transform: scaleY(-1); border-radius: 6px; border: 2px solid var(--edge); background: var(--c); box-shadow: inset 0 -3px 0 rgba(0,0,0,.14), inset 0 2px 0 rgba(255,255,255,.35); cursor: pointer; transition: transform .35s var(--bounce), filter .2s; animation: drop .8s var(--bounce) both; }
.blk:hover { transform: scaleY(-1) translateY(-4px) scale(1.14) rotate(-6deg); z-index: 2; }
.blk.empty { background: transparent; border: 2px dashed color-mix(in srgb, var(--ink) 22%, transparent); box-shadow: none; cursor: default; animation-name: fadein; }
.blk.empty:hover { transform: scaleY(-1); }
.blk.gap { background: repeating-linear-gradient(-45deg, var(--butter) 0 4px, var(--edge) 4px 8px); cursor: default; }
.blk.away { background: var(--tint); box-shadow: none; cursor: default; }
.blk.away::after { content: "z"; display: grid; place-items: center; height: 100%; font: 800 10px/1 var(--display); color: var(--muted); }
.blk.pick { animation: wiggle .5s var(--bounce); filter: brightness(1.08); box-shadow: 0 0 0 2px var(--paper), 0 0 0 4.5px var(--edge); }
.blk.live { animation: drop .8s var(--bounce) both, pulse 1.6s ease-in-out infinite 1.6s; }
@keyframes drop { from { transform: scaleY(-1) translateY(-260px) rotate(var(--r, 8deg)); opacity: 0; } 60% { opacity: 1; } to { transform: scaleY(-1); opacity: 1; } }
@keyframes fadein { from { opacity: 0; } }
@keyframes wiggle { 0%,100% { transform: scaleY(-1) rotate(0); } 30% { transform: scaleY(-1) rotate(-10deg) scale(1.1); } 60% { transform: scaleY(-1) rotate(7deg); } }
@keyframes pulse { 50% { filter: brightness(1.25); } }
.col-label { font: 800 12px/1 var(--display); color: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 14px; font: 700 12px/1 var(--body); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--edge); background: var(--c); }

/* buddy bubble + detail */
.say { position: relative; padding: 16px 18px; background: var(--butter); color: #1b1530; border: var(--b) solid var(--edge); border-radius: 20px 20px 20px 6px; box-shadow: var(--sh); font: 700 14px/1.65 var(--body); }
.say b { font: 400 16px/1 var(--fun); display: block; margin-bottom: 6px; }
.detail { display: grid; gap: 14px; transform: rotate(.6deg); }
.detail.pop { animation: popin .6s var(--bounce); }
@keyframes popin { from { transform: rotate(-3deg) scale(.92); opacity: .4; } }
.dh { display: flex; gap: 12px; align-items: center; }
.ico { width: 40px; height: 40px; border-radius: 13px; border: var(--b) solid var(--edge); background: var(--c); display: grid; place-items: center; font: 800 13px/1 var(--display); color: #1b1530; box-shadow: var(--sh-sm); flex: none; }
.ico.lg { width: 56px; height: 56px; border-radius: 17px; font-size: 18px; transform: rotate(-5deg); }
.ico.gap { background: repeating-linear-gradient(-45deg, var(--butter) 0 4px, var(--edge) 4px 8px); }
.ico.away { background: var(--tint); color: var(--muted); }
.dh .nm { font: 800 17px/1.25 var(--body); }
.dh .ex { font: 700 12px/1.3 var(--body); color: var(--muted); }
.big { font: 800 52px/1 var(--display); letter-spacing: -.03em; }
.big small { font-size: 22px; color: var(--ink-2); }
.stat-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { padding: 6px 11px; border-radius: 99px; border: 2px solid var(--edge); background: var(--paper-2); font: 800 12.5px/1 var(--body); white-space: nowrap; }
.pill b { font-family: var(--display); }
.bars { display: grid; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 40px minmax(0,1fr) 62px; gap: 10px; align-items: center; font: 800 12px/1 var(--body); color: var(--ink-2); }
.bar-row b { font: 800 13px var(--display); text-align: right; color: var(--ink); }
.bar { height: 16px; border-radius: 99px; border: 2px solid var(--edge); background: var(--paper-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); border-right: 2px solid var(--edge); transform-origin: left; animation: grow 1s var(--bounce) both .25s; }
@keyframes grow { from { transform: scaleX(0); } }

/* ruler */
.ruler-card { margin-top: 22px; padding: 16px 20px 12px; }
.ruler-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.ruler { position: relative; height: 54px; border: var(--b) solid var(--edge); border-radius: 14px; background: var(--paper-2); overflow: hidden; cursor: crosshair; touch-action: none; }
.ruler .seg { position: absolute; top: 9px; bottom: 9px; background: var(--c); border: 2px solid var(--edge); border-radius: 6px; animation: grow .8s var(--bounce) both; transform-origin: left; }
.ruler .seg.gap { background: repeating-linear-gradient(-45deg, var(--butter) 0 4px, var(--edge) 4px 8px); }
.ruler .seg.away { top: 22px; bottom: 22px; background: var(--tint); }
.ruler .now { position: absolute; top: -2px; bottom: -2px; width: 3px; background: var(--tomato); }
.ruler .now::before { content: "现在"; position: absolute; top: 2px; left: 5px; font: 800 9.5px/1 var(--body); color: var(--tomato); white-space: nowrap; }
.band { position: absolute; top: 3px; bottom: 3px; border: 3px solid var(--edge); border-radius: 11px; background: transparent; box-shadow: 0 0 0 999px color-mix(in srgb, var(--paper-2) 62%, transparent); cursor: grab; }
.band .hd { position: absolute; top: 50%; width: 16px; height: 34px; margin-top: -17px; border-radius: 7px; border: var(--b) solid var(--edge); background: var(--butter); cursor: ew-resize; transition: transform .4s var(--bounce); }
.band .hd:hover { transform: scale(1.2) rotate(-6deg); }
.band .hd.l { left: -10px; } .band .hd.r { right: -10px; }
.band.boing { animation: boing .55s var(--bounce); }
@keyframes boing { 30% { transform: scaleY(1.18); } 60% { transform: scaleY(.94); } }
.ticks { position: relative; height: 20px; margin-top: 6px; font: 800 11px/1 var(--display); color: var(--muted); }
.ticks span { position: absolute; transform: translateX(-50%); top: 4px; }

/* list */
.list-card { margin-top: 22px; }
.list { display: grid; gap: 8px; margin-top: 12px; }
.row { width: 100%; display: grid; grid-template-columns: 52px 40px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 8px 12px 8px 10px; border: 2px solid transparent; border-radius: 16px; text-align: left; transition: transform .35s var(--bounce), background .2s, border-color .2s, box-shadow .2s; animation: slide .55s var(--bounce) both; }
@keyframes slide { from { opacity: 0; transform: translateX(-24px) rotate(-1deg); } }
.row:hover { background: var(--paper-2); border-color: var(--edge); transform: translateX(4px) rotate(-.4deg); }
.row.on { background: color-mix(in srgb, var(--c) 22%, var(--paper)); border-color: var(--edge); box-shadow: var(--sh-sm); }
.row .t { font: 800 13px/1 var(--display); color: var(--muted); }
.row .nm { font: 800 14px/1.25 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .rg { font: 700 11.5px/1.3 var(--body); color: var(--muted); }
.row .d { padding: 5px 10px; border-radius: 99px; border: 2px solid var(--edge); background: var(--c); color: #1b1530; font: 800 12.5px/1 var(--display); }
.row.gaprow { cursor: default; background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--butter) 40%, transparent) 0 10px, transparent 10px 20px); border-color: var(--edge); border-style: dashed; }
.row.gaprow:hover { transform: none; }
.row.awayrow { opacity: .65; cursor: default; }
.row.awayrow:hover { transform: none; background: none; border-color: transparent; }
.live-tag { margin-left: 6px; padding: 1px 7px; border-radius: 99px; background: var(--tomato); color: #1b1530; border: 2px solid var(--edge); font: 800 10.5px/1.4 var(--body); vertical-align: 1px; animation: pulse 1.4s ease-in-out infinite; }

/* apps sticker wall */
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 22px; }
.sticker { position: relative; height: 252px; perspective: 900px; animation: deal .7s var(--bounce) both; }
.flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .8s var(--bounce); transform: rotate(var(--tilt)); }
.sticker.flipped .flip { transform: rotate(0deg) rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--paper); border: var(--b) solid var(--edge); border-radius: 22px; box-shadow: var(--sh); padding: 16px; display: grid; align-content: start; gap: 10px; text-align: left; }
.sticker:hover .flip:not(.flipped .flip) { transform: rotate(0deg) translateY(-4px); }
.face.back { transform: rotateY(180deg); background: var(--paper-2); gap: 6px; }
.face .nm { font: 800 16px/1.2 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.face .ex { font: 700 11.5px/1.2 var(--body); color: var(--muted); }
.face .t { font: 800 34px/1 var(--display); letter-spacing: -.02em; }
.face .t small { font-size: 13px; color: var(--muted); font-family: var(--body); margin-left: 6px; letter-spacing: 0; }
.battery { display: flex; height: 18px; border: 2px solid var(--edge); border-radius: 7px; overflow: hidden; background: var(--paper-2); }
.battery i { height: 100%; border-right: 2px solid var(--edge); }
.battery i:last-child { border-right: 0; }
.flip-hint { font: 700 11.5px/1 var(--body); color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.toggle-row { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 2px dashed color-mix(in srgb, var(--ink) 14%, transparent); font: 800 13px/1.3 var(--body); }
.toggle-row:last-of-type { border-bottom: 0; }
.tg { appearance: none; margin: 0; width: 44px; height: 26px; border-radius: 99px; background: var(--tint); border: var(--b) solid var(--edge); position: relative; cursor: pointer; transition: background .25s; }
.tg::after { content: ""; position: absolute; top: 1.5px; left: 1.5px; width: 18px; height: 18px; border-radius: 50%; background: var(--paper); border: var(--b) solid var(--edge); transition: transform .5s var(--bounce); }
.tg:checked { background: var(--mint); }
.tg:checked::after { transform: translateX(18px); }
.search { height: 40px; width: 230px; border: var(--b) solid var(--edge); border-radius: 14px; background: var(--paper); box-shadow: var(--sh-sm) inset; padding-inline: 14px; font: 700 13.5px var(--body); }

.pola { min-width: 0; padding: 7px 7px 22px; background: #fffdf7; border: 2px solid var(--edge); border-radius: 4px; box-shadow: 3px 3px 0 var(--edge); transform: rotate(var(--tilt)); transition: transform .4s var(--bounce), box-shadow .2s; position: relative; animation: polaIn .6s var(--bounce) both; }
@keyframes polaIn { from { opacity: 0; transform: translateY(-30px) rotate(calc(var(--tilt) * -3)); } }
.pola:hover { transform: rotate(0) translateY(-6px) scale(1.06); box-shadow: 6px 8px 0 var(--edge); z-index: 3; }
.pola canvas { width: 100%; aspect-ratio: 16/10; display: block; border: 1.5px solid #1b1530; }
.pola span { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font: 400 11.5px/1 var(--fun); color: #1b1530; }
.pola.miss { background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--butter) 45%, var(--paper)) 0 8px, var(--paper) 8px 16px); cursor: default; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }

.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.axis { font: 800 11px var(--display); fill: var(--muted); }
.gridline { stroke: color-mix(in srgb, var(--ink) 12%, transparent); stroke-dasharray: 3 4; }

.chat-wrap { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 22px; align-items: start; }

.chip { padding: 7px 12px; border-radius: 99px; border: 2px solid var(--edge); background: var(--paper); font: 800 12.5px/1 var(--body); transition: transform .3s var(--bounce); }

.chip[aria-pressed="true"], .chip[aria-selected="true"] { background: var(--butter); color: #1b1530; box-shadow: var(--sh-sm); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.facts div { padding: 8px 10px; border-radius: 12px; background: var(--paper-2); border: 2px solid var(--edge); }
.facts small { display: block; font: 800 11px/1 var(--body); color: var(--muted); }
.facts b { font: 800 19px/1.3 var(--display); }
.confetti { position: fixed; z-index: 85; width: 10px; height: 10px; border: 2px solid var(--edge); border-radius: 3px; pointer-events: none; }
.hist div { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 10px; padding: 9px 0; border-bottom: 2px dashed color-mix(in srgb, var(--ink) 14%, transparent); }

/* settings */
.set-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; align-items: start; }
.set-card { animation: deal .7s var(--bounce) both; }
.set-card h2 { margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.set-card h2 i { width: 14px; height: 14px; border-radius: 5px; border: 2px solid var(--edge); background: var(--c); transform: rotate(12deg); }
.set-item { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 3px 12px; align-items: center; padding: 11px 0; border-bottom: 2px dashed color-mix(in srgb, var(--ink) 14%, transparent); }
.set-item:last-child { border-bottom: 0; }
.set-item .l { font: 800 13.5px/1.35 var(--body); }
.set-item p { margin: 0; grid-column: 1 / -1; font: 600 12px/1.5 var(--body); color: var(--muted); }
.set-item .v { grid-column: 1 / -1; font: 700 12.5px/1.45 var(--body); color: var(--ink-2); overflow-wrap: anywhere; }
.set-item .select { width: auto; }

.toast { position: fixed; left: 50%; bottom: 26px; z-index: 95; display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 10px; background: var(--paper); border: var(--b) solid var(--edge); border-radius: 18px; box-shadow: var(--sh); font: 800 13.5px/1.35 var(--body); transform: translate(-50%, 120px) rotate(-3deg); opacity: 0; transition: transform .55s var(--bounce), opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); }
.toast.show { transform: translate(-50%, 0) rotate(-1deg); opacity: 1; }
.toast svg { width: 34px; height: 34px; flex: none; }

@media (max-width: 1180px) { .tl-grid, .snap-grid, .chat-wrap, .stats-grid { grid-template-columns: minmax(0,1fr); } .settings-stack, .ctl { position: static; } .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); } }

  .total { font-size: 38px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

<script>/* Timelens UI concept · shared sample data.
   Every figure below is fictional example data for one day (2026-10-08, Thursday). */
const TL = (() => {
  const pad = n => String(n).padStart(2, '0');
  const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const hm = m => { m = Math.round(m); return `${pad(Math.floor(m / 60) % 24)}:${pad(((m % 60) + 60) % 60)}`; };
  const dur = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; if (!h) return `${r} 分钟`; return r ? `${h} 小时 ${r} 分` : `${h} 小时`; };
  const durHM = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h ${pad(r)}m` : `${r}m`; };
  const num = n => Math.round(n).toLocaleString('en-US');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const date = { iso: '2026-10-08', label: '10 月 8 日', week: '星期四', short: '周四' };
  const NOW = toMin('15:42');
  const RANGE = { start: toMin('08:00'), end: toMin('18:00') };

  const apps = {
    vscode:   { id: 'vscode',   name: 'Visual Studio Code', short: 'Code',   glyph: '{ }', kind: 'code',     exe: 'Code.exe',             windows: 3, open: 404, visible: 318, background: 86 },
    figma:    { id: 'figma',    name: 'Figma',              short: 'Figma',  glyph: 'Fg',  kind: 'design',   exe: 'Figma.exe',            windows: 1, open: 296, visible: 141, background: 155 },
    edge:     { id: 'edge',     name: 'Microsoft Edge',     short: 'Edge',   glyph: 'e',   kind: 'browser',  exe: 'msedge.exe',           windows: 2, open: 410, visible: 233, background: 177 },
    excel:    { id: 'excel',    name: 'Excel',              short: 'Excel',  glyph: 'X',   kind: 'sheet',    exe: 'EXCEL.EXE',            windows: 1, open: 118, visible: 61,  background: 57 },
    feishu:   { id: 'feishu',   name: '飞书',               short: '飞书',   glyph: '飞',  kind: 'chat',     exe: 'Feishu.exe',           windows: 1, open: 410, visible: 52,  background: 358 },
    wechat:   { id: 'wechat',   name: '微信',               short: '微信',   glyph: '微',  kind: 'chat',     exe: 'Weixin.exe',           windows: 1, open: 410, visible: 38,  background: 372 },
    terminal: { id: 'terminal', name: 'Windows 终端',       short: '终端',   glyph: '>_',  kind: 'terminal', exe: 'WindowsTerminal.exe',  windows: 2, open: 351, visible: 96,  background: 255 },
    music:    { id: 'music',    name: '网易云音乐',         short: '云音乐', glyph: '♪',   kind: 'music',    exe: 'cloudmusic.exe',       windows: 1, open: 362, visible: 0,   background: 362 },
  };

  const rate = { code: [72, 6], terminal: [58, 3], browser: [14, 10], design: [10, 15], sheet: [40, 11], chat: [46, 5], music: [0, 0] };
  const raw = [
    ['08:52', '09:06', 'edge', 1], ['09:06', '09:14', 'feishu', 1], ['09:14', '10:02', 'vscode', 1], ['10:02', '10:09', 'terminal', 1], ['10:09', '10:41', 'vscode', 1],
    ['10:55', '11:20', 'figma', 1], ['11:20', '11:26', 'wechat', 1], ['11:26', '12:08', 'figma', 1], ['12:08', '12:12', 'edge', 2],
    ['13:06', '13:15', 'wechat', 1], ['13:15', '13:48', 'excel', 1], ['13:48', '14:02', 'vscode', 2],
    ['14:05', '14:40', 'vscode', 2], ['14:40', '14:46', 'terminal', 2], ['14:46', '15:10', 'edge', 1], ['15:10', '15:18', 'feishu', 1], ['15:18', '15:42', 'vscode', 3],
  ];
  const r0 = rng(20261008);
  const segments = raw.map(([s, e, app, win], i) => {
    const start = toMin(s), end = toMin(e), len = end - start, [k, c] = rate[apps[app].kind];
    return { id: 'f' + i, type: 'focus', start, end, len, app, window: win, keys: Math.round(k * len * (0.8 + 0.4 * r0())), clicks: Math.round(c * len * (0.8 + 0.4 * r0())), live: i === raw.length - 1 };
  });
  const gaps = [
    { id: 'g0', type: 'gap', start: toMin('10:41'), end: toMin('10:55'), len: 14, label: '已暂停记录', reason: '你手动暂停', missing: '应用活动、键盘与鼠标计数' },
    { id: 'g1', type: 'gap', start: toMin('14:02'), end: toMin('14:05'), len: 3, label: '采集器重启', reason: '采集器意外退出后自动恢复', missing: '应用活动' },
  ];
  const away = [{ id: 'a0', type: 'away', start: toMin('12:12'), end: toMin('13:06'), len: 54, label: '锁屏', reason: '午休离开' }];
  const items = [...segments, ...gaps, ...away].sort((a, b) => a.start - b.start);

/* ---------- timeline: the block tower ---------- */
function slotAt(t) {
  const counts = {};
  let gap = 0, aw = 0;
  for (let m = t; m < t + 5; m++) {
    if (m >= NOW) break;
    const s = TL.focusAt(m); if (s) counts[s.id] = (counts[s.id] || 0) + 1;
    if (gaps.some(g => m >= g.start && m < g.end)) gap++;
    if (away.some(a => m >= a.start && m < a.end)) aw++;
  }
  const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  if (gap >= 2 && (!best || gap >= best[1])) return { type: 'gap', item: gaps.find(g => t + 2 >= g.start && t + 2 < g.end) || gaps.find(g => g.end > t && g.start < t + 5) };
  if (aw >= 3) return { type: 'away', item: away[0] };
  if (best && best[1] >= 2) return { type: 'focus', item: segments.find(s => s.id === best[0]) };
  return { type: 'empty' };
}

  $('#polaWall', el).innerHTML = Object.entries(byHour).map(([h, arr]) => `<div class="hour-block"><h3>${TL.pad(h)}:00 <small>${arr.filter(s => s.status === 'saved').length} 张</small></h3><div class="polas">${arr.map(s => s.status === 'saved'
    ? `<button class="pola" data-id="${s.id}" style="--tilt:${tilt(k)}deg;animation-delay:${Math.min(k++ * .02, 1.2)}s"><span>${hm(s.t)}</span></button>`
    : `<div class="pola miss" style="--tilt:${tilt(k)}deg;animation-delay:${Math.min(k++ * .02, 1.2)}s"><div class="void">${s.reason}</div><span>${hm(s.t)}</span></div>`).join('')}</div></div>`).join('');
  $$('.pola[data-id]', el).forEach(p => { const s = snapshots.find(x => x.id === p.dataset.id); p.insertBefore(shot(s, 256, 160), p.firstChild); });
  $('#polaWall', el).addEventListener('click', e => { const p = e.target.closest('.pola[data-id]'); if (p) openPola(p.dataset.id); });
  $('#ivSeg', el).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.interval = +b.dataset.v; $$('#ivSeg button').forEach(x => x.setAttribute('aria-pressed', x === b)); toast(`改成每 ${b.dataset.v} 分钟一张，从现在重新计时`); });
  $('#scrSeg', el).addEventListener('click', e => { const b = e.target.closest('button'); if (b) $$('#scrSeg button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#ret', el).addEventListener('change', e => toast(`缩短到 ${e.target.value} 会删掉更早的图，真实应用会先问你`));
  $('#snapOn', el).addEventListener('change', e => toast(e.target.checked ? '定时快照开了' : '定时快照关了'));
  $('#shoot', el).addEventListener('click', () => { $('#flash').animate([{ opacity: .95 }, { opacity: 0 }], { duration: reduced ? 1 : 600, easing: 'ease-out' }); setTimeout(() => openPola(TL.snapSaved[TL.snapSaved.length - 1].id, '刚刚 15:42'), reduced ? 0 : 280); });
};
function openPola(id, label) {
  const s = snapshots.find(x => x.id === id), m = $('#modal');
  m.innerHTML = `<div class="big-pola"><div class="cap"><span>${label || hm(s.t)} · ${apps[s.app].short}</span><small>${s.size} KB · 校验通过 · ${s.display}</small><span style="display:flex;gap:8px"><button class="btn btn-sm btn-r" id="pDel">删除</button><button class="btn btn-sm btn-y" id="pClose">收起 · Esc</button></span></div></div>`;
  $('.big-pola', m).insertBefore(shot(s, 1600, 1000), $('.cap', m));
  m.hidden = false; $('#pClose').focus();
  const close = () => { m.hidden = true; m.innerHTML = ''; removeEventListener('keydown', esc); };
  const esc = e => { if (e.key === 'Escape') close(); };
  addEventListener('keydown', esc);
  $('#pClose').addEventListener('click', close);
  $('#pDel').addEventListener('click', e => { const b = e.currentTarget; if (b.dataset.armed) { toast('删掉了（示例），时间线会留一条“用户已删除”'); close(); } else { b.dataset.armed = 1; b.textContent = '真的删？'; } });
  m.onclick = e => { if (e.target === m) close(); };
}

/* ---------- stats ---------- */
RENDER.stats = el => {
  const kp = [['聚焦总计', durHM(TL.focusTotal), '重叠时间只算一次', 'var(--butter)'], ['数据覆盖率', (TL.coverage * 100).toFixed(1) + '%', '2 条缺口，共 17 分钟', 'var(--mint)'], ['键盘', num(TL.keysTotal), `鼠标 ${num(TL.clicksTotal)} 次`, 'var(--a-vscode)'], ['快照', TL.snapSaved.length + ' 张', `没拍 ${snapshots.length - TL.snapSaved.length} 张`, 'var(--a-feishu)']];
  el.innerHTML = `<div class="head"><div><h1>今日成绩单</h1><div class="sub">本地报告，不经过 AI</div></div><div class="head-actions"><button class="btn btn-y" id="genRep">生成本地报告</button></div></div>
  <div class="kpis">${kp.map((k, i) => `<div class="kpi" style="--c:${k[3]};--tilt:${tilt(i + 2)}deg;animation-delay:${i * .07}s"><small>${k[0]}</small><b class="num">${k[1]}</b><em>${k[2]}</em></div>`).join('')}</div>
  <div class="stats-grid"><div style="display:grid;gap:22px">
    <div class="card chart"><div class="ruler-top"><h2>每小时专注</h2><span class="sub">分钟 · 按应用叠起来</span></div><svg id="chart" viewBox="0 0 640 250"></svg></div>
    <div class="card"><div class="ruler-top"><h2>键位热度</h2><span class="sub">只有位置和次数，没有顺序和内容</span></div><div class="kbd" id="kbd"></div></div></div>
    <div style="display:grid;gap:22px">
      <div class="card"><h2 style="margin-bottom:10px">系统状态</h2><div class="states">${TL.systemStates.map(s => `<span class="pill">${s.label} <b>${s.min ? s.min + 'm' : '—'}</b></span>`).join('')}</div></div>
      <div class="card"><h2 style="margin-bottom:6px">永久累计</h2><div class="facts">${[['键盘', TL.lifetime.keys], ['左键', TL.lifetime.left], ['右键', TL.lifetime.right], ['中键', TL.lifetime.middle]].map(([l, v]) => `<div><small>${l}</small><b class="num">${num(v)}</b></div>`).join('')}</div><div class="sub" style="margin-top:8px;font-size:11.5px">自 ${TL.lifetime.since} 起，清空数据前一直保留</div></div>
      <div class="card"><h2 style="margin-bottom:4px">应用明细</h2><div class="table-wrap"><table class="tbl"><thead><tr><th>应用</th><th>聚焦</th><th>打开</th></tr></thead><tbody>${appList.map(a => `<tr><td><span class="cell-app" style="--c:${col(a.id)}"><i></i>${a.short}</span></td><td>${a.focus ? durHM(a.focus) : '—'}</td><td>${durHM(a.open)}</td></tr>`).join('')}</tbody></table></div></div>
    </div></div>`;
  const svg = $('#chart', el), L = 34, B = 214, T = 14, W = 640 - L - 6, bw = W / TL.hourly.length;
  let h = '';
  [0, 20, 40, 60].forEach(v => { const y = B - (B - T) * v / 60; h += `<line class="gridline" x1="${L}" x2="634" y1="${y}" y2="${y}"/><text class="axis" x="${L - 8}" y="${y + 4}" text-anchor="end">${v}</text>`; });
  TL.hourly.forEach((row, i) => {
    let y = B; const x = L + i * bw + bw * .16, w = bw * .68;
    appList.forEach(a => { const m = row.by[a.id]; if (!m) return; const hh = (B - T) * m / 60; h += `<rect class="cbar" data-h="${row.h}" data-app="${a.id}" data-m="${m}" x="${x}" y="${y - hh}" width="${w}" height="${hh}" rx="6" fill="${col(a.id)}" stroke="var(--edge)" stroke-width="2.5" style="animation-delay:${.2 + i * .07}s"/>`; y -= hh; });
    h += `<text class="axis" x="${x + w / 2}" y="${B + 22}" text-anchor="middle">${TL.pad(row.h)}</text>`;
  });
  h += `<line x1="${L}" x2="634" y1="${B}" y2="${B}" stroke="var(--edge)" stroke-width="3" stroke-linecap="round"/>`;
  svg.innerHTML = h;
  svg.addEventListener('pointermove', e => { const r = e.target.closest('rect'); if (!r) return hideTip(); showTip(`${TL.pad(r.dataset.h)}:00 · ${apps[r.dataset.app].name}<br>${r.dataset.m} 分钟`, e.clientX, e.clientY); });
  svg.addEventListener('pointerleave', hideTip);
  const heat = v => v < .2 ? 'var(--paper-2)' : v < .4 ? 'color-mix(in srgb, var(--mint) 55%, var(--paper))' : v < .6 ? 'var(--mint)' : v < .8 ? 'var(--butter)' : 'var(--tomato)';
  let k = 0;
  $('#kbd', el).innerHTML = TL.kb.map(row => `<div class="kbd-row">${row.map(([key, w]) => { const c = TL.keyCount[key] || 0, v = Math.pow(c / TL.keyMax, .5); return `<span class="key ${v < .2 ? 'cold' : ''}" style="--w:${w};--kc:${heat(v)};animation-delay:${.2 + (k++) * .012}s" data-k="${key.trim()}" data-c="${c}">${key.trim()}</span>`; }).join('')}</div>`).join('');
  $('#kbd', el).addEventListener('pointermove', e => { const t = e.target.closest('.key'); if (!t) return hideTip(); const r = t.getBoundingClientRect(); showTip(`${t.dataset.k} · ${num(+t.dataset.c)} 次`, r.left + r.width / 2, r.top); });
  $('#kbd', el).addEventListener('pointerleave', hideTip);
  $('#genRep', el).addEventListener('click', e => { confetti(e.currentTarget); toast('报告 R-20261008-1542 生成好啦'); });
};
function confetti(from) {
  if (reduced) return;
  const r = from.getBoundingClientRect(), colors = ['--butter', '--tomato', '--mint', '--grape', '--a-vscode', '--a-feishu'];
  for (let i = 0; i < 26; i++) {
    const c = document.createElement('i'); c.className = 'confetti'; c.style.background = `var(${colors[i % colors.length]})`; c.style.left = (r.left + r.width / 2) + 'px'; c.style.top = (r.top + r.height / 2) + 'px'; document.body.appendChild(c);
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 120;
    c.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d - 40}px) rotate(${Math.random() * 540}deg)`, opacity: 1, offset: .6 }, { transform: `translate(${Math.cos(a) * d * 1.2}px, ${Math.sin(a) * d + 80}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }], { duration: 1100 + Math.random() * 400, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => c.remove();
  }
}

/* ---------- AI: buddy chat ---------- */
const buddyAv = '<svg viewBox="0 0 40 40"><circle cx="20" cy="21" r="16" fill="var(--butter)" stroke="var(--edge)" stroke-width="2.5"/><circle cx="20" cy="20" r="9" fill="#fff" stroke="var(--edge)" stroke-width="2.5"/><circle cx="21" cy="20" r="4" fill="#1b1530"/><circle cx="22.5" cy="18.5" r="1.3" fill="#fff"/></svg>';
RENDER.ai = el => {
  const c = TL.ai.connection, p = TL.ai.preview;
  el.innerHTML = `<div class="head"><div><h1>和小透聊今天</h1><div class="sub">AI 总结 · 用你自己的服务和密钥（${c.model}）</div></div></div>
  <div class="chat-wrap"><div class="chat" id="chat">
    <div class="msg"><span class="av">${buddyAv}</span><div class="bubble" id="answer">${TL.ai.summary.map(t => `<p>${t}</p>`).join('')}</div></div>
    <div class="msg me"><div class="bubble">${TL.ai.followup.q}</div></div>
    <div class="msg"><span class="av">${buddyAv}</span><div class="bubble">${TL.ai.followup.a}</div></div>
  </div>
  <div class="ctl"><div class="card" style="display:grid;gap:12px"><div class="tabs" id="aiTabs" role="tablist">${[['sum', '总结'], ['conn', '连接'], ['plan', '计划'], ['hist', '历史']].map(([id, l]) => `<button class="chip" role="tab" data-t="${id}" aria-selected="${id === state.aiTab}">${l}</button>`).join('')}</div><div id="ctlBody"></div></div></div></div>
  <form class="ask" id="ask" style="max-width:calc(100% - 0px)"><input id="askIn" placeholder="问小透点什么，比如“下午为什么那么碎？”" aria-label="继续提问"><button class="btn btn-y" type="submit">发送</button></form>`;
  const drawCtl = () => {
    const T = {
      sum: `<div class="field"><span>范围</span><div class="seg" id="rg"><button aria-pressed="true">今天</button><button aria-pressed="false">上午</button><button aria-pressed="false">下午</button><button aria-pressed="false">昨天</button></div></div>
        <label class="field"><span>提示词预设</span><select class="select">${TL.ai.presets.map(x => `<option>${x}</option>`).join('')}</select></label>
        <div class="facts"><div><small>覆盖率</small><b>${p.coverage}</b></div><div><small>应用</small><b>${p.apps}</b></div><div><small>缺口</small><b>${p.gaps}</b></div><div><small>图片</small><b>${p.images}</b></div></div>
        <button class="btn btn-y" id="send">✦ 发送并生成总结</button><div class="sub" style="font-size:11.5px">只发聚合事实：应用名、时长、缺口和输入总数。图片要你逐张点头才会发。</div>`,
      conn: `<div class="dh"><span class="ico lg" style="--c:var(--grape)">AI</span><div><div class="nm">${c.name}</div><div class="ex">${c.protocol}</div></div></div><span class="pill" style="background:var(--mint);color:#1b1530;justify-self:start">连接已验证</span><div class="sub">密钥只存在 Windows 凭据管理器，不进数据库和备份。</div><button class="btn btn-sm" id="test">保存并测试</button>`,
      plan: `<label class="toggle-row" for="pd">每日 22:00 总结前一天<input class="tg" id="pd" type="checkbox" checked></label><label class="toggle-row" for="pi">每 4 小时总结一次<input class="tg" id="pi" type="checkbox"></label><div class="sub" style="font-size:11.5px">计划只发文本，不发图片。关机错过的只补最近一个时段。</div>`,
      hist: `<div class="hist">${TL.ai.history.map(h => `<div><span>${h.range}${h.pinned ? ' 📌' : ''}</span><small>${h.at} · ${h.preset}</small><span class="st pill" style="background:${h.status.startsWith('失败') ? 'var(--tomato)' : 'var(--mint)'};color:#1b1530">${h.status.startsWith('失败') ? '失败' : '成功'}</span></div>`).join('')}</div>`,
    };
    const b = $('#ctlBody', el); b.innerHTML = T[state.aiTab]; b.style.display = 'grid'; b.style.gap = '12px';
    const rg = $('#rg', b); if (rg) rg.addEventListener('click', e => { const x = e.target.closest('button'); if (x) $$('button', rg).forEach(y => y.setAttribute('aria-pressed', y === x)); });
    const s = $('#send', b); if (s) s.addEventListener('click', e => regenerate(e.currentTarget));
    const t = $('#test', b); if (t) t.addEventListener('click', () => toast('连接已验证，测试只用了合成数据'));
  };
  $('#aiTabs', el).addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; state.aiTab = b.dataset.t; $$('#aiTabs .chip').forEach(x => x.setAttribute('aria-selected', x === b)); drawCtl(); });
  drawCtl();
  $('#ask', el).addEventListener('submit', e => { e.preventDefault(); const q = ($('#askIn').value.trim() || '下午为什么那么碎？').replace(/</g, '&lt;'); $('#askIn').value = ''; const chat = $('#chat'); chat.insertAdjacentHTML('beforeend', `<div class="msg me"><div class="bubble">${q}</div></div><div class="msg"><span class="av">${buddyAv}</span><div class="bubble"></div></div>`); const bub = chat.lastElementChild.querySelector('.bubble'); bub.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>'; bub.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); setTimeout(() => typeInto(bub, ['下午 13:06 之后你在微信、Excel、VS Code、终端、Edge 和飞书之间切了 7 次，平均每段 19 分钟。上午平均每段 30 分钟。主要的碎片来自 14:40–15:18 这一段。']), reduced ? 0 : 900); });
};
let tok = 0;
function regenerate(btn) {
  const a = $('#answer'); if (!a) return; const my = ++tok;
  a.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  setTimeout(() => my === tok && typeInto(a, TL.ai.summary, my, () => { confetti(btn); toast('新版本总结好啦，旧版本也留着'); }), reduced ? 0 : 1200);
}
function typeInto(host, paras, my = ++tok, done) {
  host.innerHTML = ''; let pi = 0, ci = 0, p = null; const caret = document.createElement('span'); caret.className = 'caret';
  const step = () => {
    if (my !== tok) return; if (pi >= paras.length) { caret.remove(); done && done(); return; }
    if (!p) { p = document.createElement('p'); p.append(document.createTextNode(''), caret); host.appendChild(p); }
    const n = reduced ? 1e4 : 2 + Math.floor(Math.random() * 3); p.firstChild.textContent += paras[pi].slice(ci, ci + n); ci += n;
    if (ci >= paras[pi].length) { pi++; ci = 0; p = null; }
    setTimeout(step, reduced ? 0 : 30);
  };
  step();
}

/* ---------- settings ---------- */

  el.innerHTML = `<div class="head"><div><h1>设置</h1><div class="sub">全部在本机，加密保存，随时可以清空</div></div></div>
  <div class="set-grid">${TL.settings.map((g, gi) => `<section class="card set-card" style="animation-delay:${gi * .08}s;transform:rotate(${tilt(gi + 3) / 2}deg)"><h2><i style="--c:${cs[gi]}"></i>${g.title}</h2>${g.items.map(it => {
    if (it.type === 'toggle') return `<div class="set-item"><label class="l" for="${it.id}">${it.label}</label><input class="tg" type="checkbox" id="${it.id}" ${it.value ? 'checked' : ''}><p>${it.desc}</p></div>`;
    if (it.type === 'select') return `<div class="set-item"><label class="l" for="${it.id}">${it.label}</label><select class="select" id="${it.id}">${it.options.map(o => `<option ${o === it.value ? 'selected' : ''}>${o}</option>`).join('')}</select><p>${it.desc}</p></div>`;
    if (it.type === 'info') return `<div class="set-item"><span class="l">${it.label}</span><span class="v">${it.value}</span></div>`;
    if (it.type === 'meter') return `<div class="set-item"><span class="l">${it.label}</span><span class="num sub">${it.used} / ${it.total} MB</span><div class="meter" style="grid-column:1/-1"><i style="width:${it.used / it.total * 100}%"></i></div><p>${it.desc}</p></div>`;
    return `<div class="set-item"><span class="l">${it.label}</span><button class="btn btn-sm ${it.type === 'danger' ? 'btn-r' : ''}" data-act="${it.label}">${it.type === 'danger' ? '清空' : '打开'}</button><p>${it.desc}</p></div>`;
  }).join('')}</section>`).join('')}</div>`;
  $('#set-pause', el).checked = state.paused;
  $('#set-pause', el).addEventListener('change', togglePause);
  $('#set-retain', el).addEventListener('change', e => toast(`缩短到 ${e.target.value} 之前会先问你（示例没删东西）`));
  el.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) toast(`${b.dataset.act.replace('…', '')}：原型里只放了入口`); });
};

let start = 'timeline';
try { const p = localStorage.getItem('tl-blocks-page'); if (p && RENDER[p]) start = p; } catch (e) {}
if (location.hash && RENDER[location.hash.slice(1)]) start = location.hash.slice(1);
go(start);
})();
</script>
