<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timelens 暗房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* Layout: reel tabs on top | projection screen + slate | scrubbable film strip with light track | cue sheet.
   A deliberately single, dark "darkroom" world: warm film-base black, safelight amber, developer cyan. */
:root {
  color-scheme: dark;
  --base: #100c09; --base-2: #17120e; --panel: #1e1813; --panel-2: #261e17; --hover: rgba(255,214,170,.05);
  --line: rgba(255,214,170,.08); --line-2: rgba(255,214,170,.17);
  --ink: #f2e8d9; --ink-2: #bba993; --muted: #7c6d5c;
  --amber: #ffad3d; --amber-soft: rgba(255,173,61,.14); --amber-glow: rgba(255,173,61,.45);
  --cyan: #74d8d0; --cyan-soft: rgba(116,216,208,.13);
  --red: #ff5b4c; --red-soft: rgba(255,91,76,.14); --ok: #8ed39c;
  --film: #0a0807; --sprocket: #2b231c;
  --a-vscode: #77a2ff; --a-figma: #c48dff; --a-edge: #52c6da; --a-excel: #f08b4b; --a-feishu: #ff7eaa; --a-wechat: #6fd28f; --a-terminal: #aaa197; --a-music: #e8c25a;
  --display: "Big Shoulders Display", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
  --mono: "IBM Plex Mono", "Noto Sans SC", ui-monospace, Consolas, monospace;
  --sans: "IBM Plex Sans", "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
  --cn: "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", sans-serif;
  --ease: cubic-bezier(.16,1,.3,1); --snap: cubic-bezier(.7,0,.2,1);
  --FW: 132px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--base); color: var(--ink); font: 400 13.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 1.5px solid var(--amber); outline-offset: 2px; }
.num, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
::selection { background: var(--amber); color: var(--base); }
.grain { position: fixed; inset: 0; z-index: 90; pointer-events: none; opacity: .07; mix-blend-mode: screen; animation: grain .9s steps(6) infinite; background-size: 160px; }
@keyframes grain { 0% { background-position: 0 0; } 20% { background-position: -40px 30px; } 40% { background-position: 50px -60px; } 60% { background-position: -70px -20px; } 80% { background-position: 20px 70px; } 100% { background-position: 0 0; } }
.safelight { position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(60% 50% at 50% -10%, rgba(255,140,40,.10), transparent 70%); }

.app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: auto minmax(0,1fr); }
/* top: reel tabs */
.top { display: flex; align-items: stretch; gap: 0; border-bottom: 1px solid var(--line); background: linear-gradient(var(--base-2), var(--base)); min-width: 0; }
.logo { display: flex; align-items: center; gap: 10px; padding-inline: 18px 22px; font: 800 19px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; border-right: 1px solid var(--line); white-space: nowrap; }
.logo i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--amber); box-shadow: 0 0 12px var(--amber-glow), inset 0 0 0 2px var(--base); background: var(--amber); }
.reels { position: relative; display: flex; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.reels::-webkit-scrollbar { display: none; }
.reel-tab { position: relative; padding: 16px 18px 14px; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; color: var(--muted); transition: color .3s; }
.reel-tab b { font: 500 10.5px/1 var(--mono); letter-spacing: .08em; color: var(--muted); }
.reel-tab span { font: 500 14px/1 var(--cn); }
.reel-tab:hover { color: var(--ink-2); }
.reel-tab[aria-current="page"] { color: var(--ink); }
.reel-tab[aria-current="page"] b { color: var(--amber); }
.reel-bar { position: absolute; bottom: -1px; height: 2px; background: var(--amber); box-shadow: 0 0 14px 1px var(--amber-glow); transition: left .55s var(--snap), width .55s var(--snap); }
.rec { margin-left: auto; display: flex; align-items: center; gap: 14px; padding-inline: 18px; border-left: 1px solid var(--line); white-space: nowrap; }
.rec-tc { font: 500 13px/1 var(--mono); letter-spacing: .06em; color: var(--ink-2); }
.rec-tc em { font-style: normal; color: var(--red); margin-right: 8px; letter-spacing: .14em; }
.rec-tc em::before { content: "●"; margin-right: 6px; animation: recBlink 1.2s steps(2) infinite; }
@keyframes recBlink { 50% { opacity: .15; } }
.paused .rec-tc em { color: var(--muted); }
.paused .rec-tc em::before { content: "■"; animation: none; }
.btn { height: 34px; padding-inline: 14px; display: inline-flex; align-items: center; gap: 8px; font: 500 12.5px/1 var(--cn); border: 1px solid var(--line-2); border-radius: 4px; background: var(--panel); color: var(--ink); transition: border-color .25s, background .25s, transform .2s; white-space: nowrap; }
.btn:hover { border-color: var(--amber); background: var(--panel-2); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 15px; height: 15px; }
.btn-amber { background: var(--amber); border-color: var(--amber); color: #1a0f02; font-weight: 700; box-shadow: 0 0 0 0 var(--amber-glow); transition: box-shadow .4s, transform .2s; }
.btn-amber:hover { background: var(--amber); box-shadow: 0 0 24px 2px var(--amber-glow); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn-red { color: var(--red); }
.caption { display: flex; border-left: 1px solid var(--line); }
.caption span { width: 44px; display: grid; place-items: center; color: var(--muted); }
.caption span:hover { background: var(--hover); color: var(--ink); }
.caption svg { width: 10px; height: 10px; }

.stage { position: relative; min-height: 0; overflow: hidden; }
.page { position: absolute; inset: 0; overflow: auto; padding: 22px 26px 30px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.shutter { position: absolute; inset: 0; z-index: 30; pointer-events: none; display: grid; grid-template-rows: 1fr 1fr; }
.shutter i { background: var(--film); transform: scaleY(0); }
.shutter i:first-child { transform-origin: top; } .shutter i:last-child { transform-origin: bottom; }
.shutter.go i { animation: shut .62s var(--snap); }
@keyframes shut { 0% { transform: scaleY(0); } 42%, 58% { transform: scaleY(1); } 100% { transform: scaleY(0); } }

.head { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 14px 26px; margin-bottom: 18px; }
.kicker { font: 500 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--amber); margin-bottom: 8px; }
h1 { margin: 0; font: 800 46px/.92 var(--display); letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
h1 .cn { font: 900 34px/1 var(--cn); letter-spacing: .02em; }
h1 small { font: 500 16px/1 var(--cn); color: var(--ink-2); margin-left: 10px; text-transform: none; letter-spacing: 0; }
h2 { margin: 0; font: 700 14px/1.3 var(--cn); letter-spacing: .02em; }
.label { font: 500 10.5px/1.2 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.head-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.days { display: flex; border: 1px solid var(--line-2); border-radius: 4px; overflow: hidden; }
.days button { width: 38px; padding: 6px 0 5px; display: grid; justify-items: center; gap: 2px; font: 500 10px/1 var(--mono); color: var(--muted); border-right: 1px solid var(--line); }
.days button:last-child { border-right: 0; }
.days button b { font: 700 15px/1 var(--display); color: var(--ink-2); }
.days button[aria-pressed="true"] { background: var(--amber); color: #1a0f02; }
.days button[aria-pressed="true"] b { color: #1a0f02; }
.days button[disabled] { opacity: .3; cursor: default; }
.days button:hover:not([disabled]):not([aria-pressed="true"]) { background: var(--hover); }

/* projection + slate */
.screen-row { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, 1fr); gap: 18px; }
.screen { position: relative; aspect-ratio: 16/10; max-width: 100%; background: #000; border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 30px 80px -20px rgba(255,150,60,.18); }
.screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(110% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.55)), linear-gradient(rgba(255,200,140,.03), rgba(255,200,140,.03)); }
.screen.flick canvas:first-of-type { animation: flick .32s steps(4) both; }
@keyframes flick { 0% { filter: brightness(1.8) contrast(.8); opacity: .6; } 35% { filter: brightness(.7); opacity: 1; } 65% { filter: brightness(1.25); } 100% { filter: none; } }
.screen .fog { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 8px; background: radial-gradient(70% 60% at 30% 40%, rgba(255,120,40,.35), transparent 70%), radial-gradient(50% 50% at 80% 70%, rgba(255,60,40,.25), transparent 70%), #0d0907; }
.fog b { font: 800 44px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.fog span { font: 500 13px/1.4 var(--cn); color: var(--ink-2); }
.screen-meta { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; justify-content: space-between; gap: 10px; padding: 12px 14px; font: 500 11px/1 var(--mono); letter-spacing: .08em; color: rgba(242,232,217,.85); background: linear-gradient(transparent, rgba(0,0,0,.6)); }
.leader { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; background: #1b1714; animation: leaderOut .3s ease-in 1.6s forwards; }
.leader svg { width: 46%; height: auto; }
.leader .sweep { transform-origin: 100px 100px; animation: sweep .53s linear 3; }
.leader text { font: 800 88px var(--display); fill: #e9dfd0; }
@keyframes sweep { from { transform: rotate(0); } to { transform: rotate(360deg); } }
@keyframes leaderOut { to { opacity: 0; visibility: hidden; } }

.slate { display: grid; grid-template-rows: auto 1fr; background: var(--panel); border-radius: 3px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; min-width: 0; }
.clapper { position: relative; height: 30px; background: #f2e8d9; overflow: hidden; transform-origin: 0 100%; }
.clapper::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(-55deg, #15100c 0 18px, #f2e8d9 18px 36px); }
.clapper.clap { animation: clap .5s var(--snap); }
@keyframes clap { 0% { transform: rotate(0); } 35% { transform: rotate(-14deg); } 70% { transform: rotate(0); } 82% { transform: rotate(-2deg); } 100% { transform: rotate(0); } }
.slate-body { display: grid; align-content: start; gap: 0; }
.slate-cell { padding: 10px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; min-width: 0; }
.slate-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; }
.slate-grid .slate-cell { border-right: 1px solid var(--line); }
.slate-grid .slate-cell:last-child { border-right: 0; }
.slate-cell .v { font: 700 22px/1 var(--display); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slate-cell .v.cn { font: 700 17px/1.2 var(--cn); }
.slate-big { font: 800 64px/.9 var(--display); letter-spacing: -.01em; }
.slate-big small { font-size: 22px; color: var(--ink-2); margin-left: 2px; }
.meter-rows { display: grid; gap: 8px; padding: 12px 16px 14px; }
.mrow { display: grid; grid-template-columns: 36px minmax(0,1fr) 62px; gap: 10px; align-items: center; font: 500 11.5px/1 var(--cn); color: var(--ink-2); }
.mrow b { font: 500 11.5px var(--mono); text-align: right; color: var(--ink); }
.ladder { display: flex; gap: 2px; height: 10px; }
.ladder i { flex: 1; background: var(--line); transition: background .3s; }
.ladder i.on { background: var(--c); box-shadow: 0 0 6px -1px var(--c); }

/* film strip */
.reel { position: relative; margin-top: 20px; margin-inline: -26px; }
.reel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; padding-inline: 26px; margin-bottom: 10px; }
.reel-head .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 6px 10px; border-radius: 3px; border: 1px solid var(--line-2); font: 500 11.5px/1 var(--cn); color: var(--ink-2); transition: all .25s; }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); background: var(--amber-soft); }
.scroller { overflow-x: auto; overflow-y: hidden; cursor: grab; scrollbar-width: none; overscroll-behavior-x: contain; }
.scroller::-webkit-scrollbar { display: none; }
.scroller.dragging { cursor: grabbing; }
.reel-view { position: relative; }
.film { position: relative; height: 200px; user-select: none; }
.strip { position: absolute; top: 20px; height: 124px; background: var(--film); box-shadow: 0 0 0 1px #000, 0 20px 40px -18px #000; }
.strip::before, .strip::after { content: ""; position: absolute; left: 0; right: 0; height: 9px; height: 7px; background: repeating-linear-gradient(90deg, transparent 0 8px, var(--sprocket) 8px 17px, transparent 17px 22px); }
.strip::before { top: 4px; } .strip::after { bottom: 4px; }
.frames { position: absolute; top: 44px; left: 0; display: flex; }
.frame { position: relative; width: var(--FW); height: 76px; padding-inline: 5px; }
.frame canvas, .frame .void { width: 100%; height: 100%; display: block; border-radius: 2px; }
.frame canvas { filter: saturate(.9) sepia(.12); transition: filter .4s, transform .4s var(--ease); }
.frame:hover canvas { filter: saturate(1.1) brightness(1.15); }
.frame .void { background: radial-gradient(60% 70% at 30% 40%, rgba(255,110,40,.35), transparent 70%), #120c09; display: grid; place-items: center; font: 500 10px/1.2 var(--cn); color: rgba(242,232,217,.55); letter-spacing: .1em; }
.frame .edge { position: absolute; left: 6px; top: -12px; font: 600 9.5px/1 var(--mono); letter-spacing: .1em; color: #c9762c; white-space: nowrap; }
.frame .edge.app { top: calc(100% + 3px); bottom: auto; color: #8a5b2e; }
.frame.out canvas, .frame.out .void { opacity: .28; }
.frames.enter .frame { animation: advance .9s steps(6) both; }
@keyframes advance { from { transform: translateX(240px); opacity: 0; } to { transform: none; opacity: 1; } }
.lighttrack { position: absolute; top: 154px; height: 18px; }
.lighttrack i { position: absolute; top: 0; bottom: 0; background: var(--c); box-shadow: 0 0 10px -2px var(--c); opacity: .85; }
.lighttrack i.gap { background: repeating-linear-gradient(135deg, var(--red) 0 3px, transparent 3px 6px); box-shadow: none; }
.lighttrack i.away { top: 7px; bottom: 7px; background: var(--line-2); box-shadow: none; }
.hours { position: absolute; top: 182px; height: 16px; font: 500 10px/1 var(--mono); color: var(--muted); }
.hours span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.hours span::before { content: ""; position: absolute; left: 50%; top: -6px; height: 4px; width: 1px; background: var(--line-2); }
.sel-io { position: absolute; top: 150px; height: 26px; border-left: 2px solid var(--cyan); border-right: 2px solid var(--cyan); background: var(--cyan-soft); pointer-events: none; transition: left .45s var(--ease), width .45s var(--ease); }
.sel-io::before, .sel-io::after { position: absolute; top: -14px; font: 600 9.5px/1 var(--mono); color: var(--cyan); letter-spacing: .1em; }
.sel-io::before { content: "IN"; left: 2px; } .sel-io::after { content: "OUT"; right: 2px; }
.gate { position: absolute; top: 36px; left: 50%; width: var(--FW); height: 92px; transform: translateX(-50%); pointer-events: none; }
.gate::before { content: ""; position: absolute; inset: 0; border: 2px solid var(--amber); border-radius: 3px; box-shadow: 0 0 22px 2px var(--amber-glow), inset 0 0 22px rgba(255,173,61,.18); }
.gate b { position: absolute; left: 50%; top: -24px; transform: translateX(-50%); padding: 3px 7px; background: var(--amber); color: #1a0f02; font: 600 11px/1 var(--mono); letter-spacing: .06em; border-radius: 2px; white-space: nowrap; }
.reel-fade { position: absolute; top: 0; bottom: 0; width: 80px; pointer-events: none; z-index: 2; }
.reel-fade.l { left: 0; background: linear-gradient(90deg, var(--base), transparent); }
.reel-fade.r { right: 0; background: linear-gradient(-90deg, var(--base), transparent); }
.reel-tip { padding-inline: 26px; margin-top: 4px; font: 400 11.5px/1.5 var(--cn); color: var(--muted); }
kbd { font: 600 10.5px/1 var(--mono); padding: 2px 5px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 3px; color: var(--ink-2); }

/* cue sheet */
.cue { margin-top: 22px; }
.cue-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 10px; flex-wrap: wrap; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font: 500 10.5px/1 var(--mono); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.r, th.r { text-align: right; }
tbody tr { transition: background .25s; cursor: pointer; }
tbody tr:hover { background: var(--hover); }
tr.cur { background: var(--amber-soft); }
tr.cur td:first-child { color: var(--amber); }
tr.cur td:first-child::before { content: "▶ "; }
tr.gap-row { cursor: default; }
tr.gap-row td { color: var(--red); }
tr.away-row td { color: var(--muted); }
.app-cell { display: flex; align-items: center; gap: 10px; font-family: var(--cn); }
.swatch { width: 10px; height: 10px; border-radius: 1px; background: var(--c); box-shadow: 0 0 8px -1px var(--c); flex: none; }
.stamp { display: inline-block; padding: 2px 6px; border: 1.5px solid currentColor; border-radius: 2px; font: 700 10.5px/1.2 var(--cn); letter-spacing: .1em; transform: rotate(-2deg); }
.live { color: var(--amber); font: 600 10.5px var(--mono); letter-spacing: .1em; margin-left: 8px; animation: recBlink 1.4s steps(2) infinite; }
.cue tbody tr { animation: rowIn .5s var(--ease) both; }
@keyframes rowIn { from { opacity: 0; transform: translateX(-12px); } }

/* apps: credits */
.credits-wrap { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr); gap: 22px; align-items: start; }
.credit { width: 100%; display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 4px 14px; align-items: center; padding: 14px 6px; border-bottom: 1px solid var(--line); text-align: left; transition: background .25s; animation: credit .8s var(--ease) both; }
@keyframes credit { from { opacity: 0; transform: translateY(26px); } }
.credit:hover { background: var(--hover); }
.credit.on { background: linear-gradient(90deg, color-mix(in srgb, var(--c) 14%, transparent), transparent); }
.credit .no { font: 600 11px/1 var(--mono); color: var(--muted); }
.credit .nm { font: 800 28px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.credit .nm.cn { font: 900 24px/1.1 var(--cn); }
.credit .role { grid-column: 2; font: 400 11.5px/1 var(--mono); color: var(--muted); }
.credit .d { grid-row: 1 / span 2; grid-column: 3; text-align: right; font: 700 26px/1 var(--display); }
.credit .d small { display: block; font: 500 10.5px/1.5 var(--mono); color: var(--muted); }
.credit .ladder { grid-column: 2 / span 2; height: 8px; margin-top: 6px; }
.ladder i.half { background: color-mix(in srgb, var(--c) 40%, transparent); }
.ladder i.dim { background: color-mix(in srgb, var(--c) 14%, transparent); }
.search { height: 34px; width: 220px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--panel); padding-inline: 12px; font-family: var(--cn); }
.search::placeholder { color: var(--muted); }
.panel { position: sticky; top: 0; background: var(--panel); border-radius: 3px; box-shadow: 0 0 0 1px var(--line); }
.panel-sec { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.panel-sec:last-child { border-bottom: 0; }
.panel .big { font: 800 40px/1 var(--display); }
.lever-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 3px 14px; align-items: center; }
.lever-row label { font: 500 13px/1.3 var(--cn); }
.lever-row p { margin: 0; font: 400 11.5px/1.5 var(--cn); color: var(--muted); }
.lever-row .lever { grid-row: 1 / span 2; grid-column: 2; }
.lever { appearance: none; margin: 0; width: 46px; height: 24px; border-radius: 3px; background: var(--base); box-shadow: inset 0 0 0 1px var(--line-2), inset 0 2px 4px rgba(0,0,0,.5); position: relative; cursor: pointer; }
.lever::before { content: "OFF"; position: absolute; right: 6px; top: 7px; font: 600 8px/1 var(--mono); color: var(--muted); letter-spacing: .08em; }
.lever::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 18px; border-radius: 2px; background: linear-gradient(#5b4c3e, #3a3027); box-shadow: 0 2px 3px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12); transition: transform .35s var(--snap), background .3s; }
.lever:checked::before { content: "ON"; left: 7px; right: auto; color: var(--amber); }
.lever:checked::after { transform: translateX(24px); background: linear-gradient(#ffc571, var(--amber)); box-shadow: 0 2px 3px rgba(0,0,0,.6), 0 0 12px var(--amber-glow); }

/* contact sheet */

.lightbox-table { position: relative; padding: 18px; background: #1d1813; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line), inset 0 0 80px rgba(255,190,120,.06); cursor: none; }
.sheet-row { display: grid; grid-template-columns: 54px minmax(0,1fr); gap: 10px; align-items: center; margin-bottom: 10px; }

.sheet-frames { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 4px; background: var(--film); padding: 5px; }
.cs { position: relative; aspect-ratio: 16/10; background: #0c0907; }
.cs canvas { width: 100%; height: 100%; display: block; filter: sepia(.15); }
.cs.miss { background: radial-gradient(60% 70% at 30% 40%, rgba(255,110,40,.3), transparent 70%), #120c09; }
.cs.empty { background: transparent; }
.cs .mark { position: absolute; inset: -6px; pointer-events: none; overflow: visible; }

.loupe { position: fixed; z-index: 70; width: 190px; height: 190px; margin: -95px 0 0 -95px; border-radius: 50%; pointer-events: none; opacity: 0; transform: scale(.6); transition: opacity .25s, transform .4s var(--ease); box-shadow: 0 0 0 6px #2b231c, 0 0 0 8px #0a0807, 0 24px 50px rgba(0,0,0,.7); overflow: hidden; background: #0a0807; }

.loupe canvas { width: 100%; height: 100%; display: block; }
.loupe::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(60% 40% at 32% 22%, rgba(255,255,255,.22), transparent 60%), radial-gradient(100% 100% at 50% 50%, transparent 62%, rgba(0,0,0,.55)); }
.loupe b { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 2; font: 600 10.5px/1 var(--mono); color: var(--amber); background: rgba(0,0,0,.6); padding: 3px 6px; border-radius: 2px; white-space: nowrap; }
.stops { display: flex; justify-content: space-between; position: relative; padding-top: 18px; }
.stops::before { content: ""; position: absolute; left: 6px; right: 6px; top: 6px; height: 2px; background: var(--line-2); }
.stops button { position: relative; font: 600 13px/1 var(--display); color: var(--muted); padding: 4px; transition: color .25s; }
.stops button::before { content: ""; position: absolute; left: 50%; top: -15px; width: 2px; height: 8px; margin-left: -1px; background: var(--line-2); }
.stops button[aria-pressed="true"] { color: var(--amber); }
.stops button[aria-pressed="true"]::before { background: var(--amber); height: 12px; top: -17px; box-shadow: 0 0 8px var(--amber-glow); }
.select { height: 34px; border-radius: 4px; border: 1px solid var(--line-2); background: var(--base); padding-inline: 10px; font-family: var(--cn); width: 100%; }
.bar { height: 6px; background: var(--base); box-shadow: inset 0 0 0 1px var(--line); }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--amber), var(--red)); box-shadow: 0 0 10px var(--amber-glow); transform-origin: left; animation: grow 1.1s var(--ease) both .2s; }
@keyframes grow { from { transform: scaleX(0); } }
.modal { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px 16px; background: rgba(5,3,2,.86); backdrop-filter: blur(6px); animation: fadeIn .3s both; }
.modal[hidden] { display: none; }
.modal-in { width: min(1000px, 100%); display: grid; gap: 12px; }
.modal .screen canvas { animation: develop 1.6s var(--ease) both; }
@keyframes develop { 0% { filter: invert(1) sepia(.8) hue-rotate(160deg) contrast(.7) blur(3px); opacity: .3; } 45% { filter: invert(.5) sepia(.6) contrast(.8) blur(1px); opacity: .8; } 100% { filter: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } }
.modal-bar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; font: 500 12px/1.4 var(--mono); color: var(--ink-2); align-items: center; }
.ok { color: var(--ok); }
.flashbang { position: fixed; inset: 0; z-index: 85; background: #fff7ea; opacity: 0; pointer-events: none; }

.block { margin-bottom: 24px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
.hist { position: relative; background: var(--panel); border-radius: 3px; box-shadow: 0 0 0 1px var(--line); padding: 16px 16px 8px; }
.hist svg { width: 100%; height: auto; display: block; overflow: visible; }
.axis { font: 500 10px var(--mono); fill: var(--muted); }
.gridline { stroke: var(--line); }
.histpath { animation: reveal 1.6s var(--ease) both .2s; }
@keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.readout { position: absolute; top: 14px; right: 16px; font: 500 11.5px/1.4 var(--mono); color: var(--amber); text-align: right; }
.kbd { display: grid; gap: 5px; padding: 18px; background: #0d0a08; border-radius: 3px; box-shadow: 0 0 0 1px var(--line); }
.kbd-row { display: flex; gap: 5px; }
.key { flex: var(--w) 1 0; min-width: 0; height: 40px; border-radius: 4px; display: grid; place-items: center; font: 500 10.5px/1 var(--mono); color: color-mix(in srgb, var(--amber) calc(var(--h) * 100%), var(--muted)); background: color-mix(in srgb, var(--amber) calc(var(--h) * 34%), #1b1511); box-shadow: inset 0 0 0 1px rgba(255,214,170,.06), 0 0 calc(var(--h) * 22px) calc(var(--h) * 2px) rgba(255,173,61,calc(var(--h) * .45)); overflow: hidden; animation: warm 1.2s var(--ease) both; }

/* AI */

.narration { position: relative; padding: 28px 30px 26px; background: radial-gradient(80% 60% at 50% 0%, rgba(255,173,61,.07), transparent 70%), var(--base-2); border-radius: 3px; box-shadow: 0 0 0 1px var(--line); }
.narration .answer { font: 400 17px/1.95 var(--cn); max-width: 40em; color: var(--ink); }
.answer p { margin: 0 0 16px; }
.answer p:first-letter { font-weight: 700; color: var(--amber); }
.caret { display: inline-block; width: .55em; height: 1.05em; margin-left: 2px; vertical-align: -3px; background: var(--amber); box-shadow: 0 0 10px var(--amber-glow); animation: recBlink .8s steps(2) infinite; }
.thinking { font: 500 12.5px/1.5 var(--mono); color: var(--ink-2); display: flex; gap: 10px; align-items: center; }
.reel-spin { width: 22px; height: 22px; border-radius: 50%; border: 2px dashed var(--amber); animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.qa { display: grid; gap: 12px; margin-top: 10px; padding-top: 18px; border-top: 1px dashed var(--line-2); }
.q { font: 500 13.5px/1.6 var(--cn); color: var(--cyan); }
.q::before { content: "问 · "; font-family: var(--mono); color: var(--muted); }
.a { font: 400 14.5px/1.8 var(--cn); color: var(--ink-2); }
.ask { display: flex; gap: 8px; margin-top: 16px; }
.ask input { flex: 1; min-width: 0; height: 38px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--base); padding-inline: 12px; font-family: var(--cn); }
.hist-list div { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-family: var(--cn); }
.hist-list small { font: 400 11px var(--mono); color: var(--muted); }
.hist-list .st { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 12px; color: var(--ok); }
.hist-list .st.bad { color: var(--red); }

/* settings */
.set-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; align-items: start; }
.set-sec { background: var(--panel); border-radius: 3px; box-shadow: 0 0 0 1px var(--line); animation: credit .7s var(--ease) both; }
.set-sec h2 { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.set-sec h2 span { font: 500 10.5px var(--mono); color: var(--muted); letter-spacing: .12em; }
.set-item { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 14px; align-items: center; }
.set-item:last-child { border-bottom: 0; }
.set-item .l { font: 500 13px/1.35 var(--cn); }
.set-item p { margin: 0; grid-column: 1 / -1; font: 400 11.5px/1.5 var(--cn); color: var(--muted); }
.set-item .v { grid-column: 1 / -1; font: 400 12px/1.5 var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.set-item .select { width: auto; }

.toast { position: fixed; left: 50%; bottom: 24px; z-index: 95; transform: translate(-50%, 16px); opacity: 0; padding: 10px 16px; background: #000; border: 1px solid var(--amber); color: var(--ink); font: 500 12.5px/1.4 var(--cn); border-radius: 3px; box-shadow: 0 0 30px var(--amber-glow); transition: transform .45s var(--ease), opacity .25s; pointer-events: none; max-width: calc(100vw - 32px); }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast::before { content: "■ "; color: var(--amber); }

@media (max-width: 1100px) { .screen-row, .credits-wrap, .sheet-wrap, .ai-wrap { grid-template-columns: minmax(0,1fr); } .panel { position: static; } .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); } .kpi:nth-child(2) { border-right: 0; } .kpi:nth-child(-n+2) { border-bottom: 1px solid var(--line); } .states { grid-template-columns: repeat(3, minmax(0,1fr)); } }
@media (max-width: 760px) {
  body { overflow: auto; }
  .app { display: block; height: auto; }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; flex-wrap: wrap; }
  .logo { padding: 12px 16px; border-right: 0; }
  .caption { display: none; }
  .rec { padding: 0 16px; border-left: 0; }
  .reels { order: 3; width: 100%; border-top: 1px solid var(--line); }
  .reel-tab { padding: 12px 14px 11px; }
  .stage { overflow: visible; }
  .page { position: relative; inset: auto; overflow: visible; padding: 18px 16px 30px; }
  .page[hidden] { display: none !important; }
  .reel { margin-inline: -16px; } .reel-head, .reel-tip { padding-inline: 16px; }
  h1 { font-size: 38px; } h1 .cn { font-size: 28px; }
  .head-actions { margin-left: 0; }
  .search { width: 100%; }
  .slate-big { font-size: 52px; }
  .sheet-frames { grid-template-columns: repeat(6, minmax(0,1fr)); }
  .lightbox-table { cursor: auto; padding: 10px; }
  .states { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .key { height: 30px; font-size: 8.5px; }
  .kpi b { font-size: 40px; }
  .narration { padding: 20px 18px; } .narration .answer { font-size: 15.5px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } .grain { display: none; } }

<script>/* Timelens UI concept · shared sample data.
   Every figure below is fictional example data for one day (2026-10-08, Thursday). */
const TL = (() => {
  const pad = n => String(n).padStart(2, '0');
  const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const hm = m => { m = Math.round(m); return `${pad(Math.floor(m / 60) % 24)}:${pad(((m % 60) + 60) % 60)}`; };
  const dur = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; if (!h) return `${r} 分钟`; return r ? `${h} 小时 ${r} 分` : `${h} 小时`; };
  const durHM = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h ${pad(r)}m` : `${r}m`; };
  const num = n => Math.round(n).toLocaleString('en-US');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const date = { iso: '2026-10-08', label: '10 月 8 日', week: '星期四', short: '周四' };
  const NOW = toMin('15:42');
  const RANGE = { start: toMin('08:00'), end: toMin('18:00') };

  const apps = {
    vscode:   { id: 'vscode',   name: 'Visual Studio Code', short: 'Code',   glyph: '{ }', kind: 'code',     exe: 'Code.exe',             windows: 3, open: 404, visible: 318, background: 86 },
    figma:    { id: 'figma',    name: 'Figma',              short: 'Figma',  glyph: 'Fg',  kind: 'design',   exe: 'Figma.exe',            windows: 1, open: 296, visible: 141, background: 155 },
    edge:     { id: 'edge',     name: 'Microsoft Edge',     short: 'Edge',   glyph: 'e',   kind: 'browser',  exe: 'msedge.exe',           windows: 2, open: 410, visible: 233, background: 177 },
    excel:    { id: 'excel',    name: 'Excel',              short: 'Excel',  glyph: 'X',   kind: 'sheet',    exe: 'EXCEL.EXE',            windows: 1, open: 118, visible: 61,  background: 57 },
    feishu:   { id: 'feishu',   name: '飞书',               short: '飞书',   glyph: '飞',  kind: 'chat',     exe: 'Feishu.exe',           windows: 1, open: 410, visible: 52,  background: 358 },
    wechat:   { id: 'wechat',   name: '微信',               short: '微信',   glyph: '微',  kind: 'chat',     exe: 'Weixin.exe',           windows: 1, open: 410, visible: 38,  background: 372 },
    terminal: { id: 'terminal', name: 'Windows 终端',       short: '终端',   glyph: '>_',  kind: 'terminal', exe: 'WindowsTerminal.exe',  windows: 2, open: 351, visible: 96,  background: 255 },
    music:    { id: 'music',    name: '网易云音乐',         short: '云音乐', glyph: '♪',   kind: 'music',    exe: 'cloudmusic.exe',       windows: 1, open: 362, visible: 0,   background: 362 },
  };

  const rate = { code: [72, 6], terminal: [58, 3], browser: [14, 10], design: [10, 15], sheet: [40, 11], chat: [46, 5], music: [0, 0] };
  const raw = [
    ['08:52', '09:06', 'edge', 1], ['09:06', '09:14', 'feishu', 1], ['09:14', '10:02', 'vscode', 1], ['10:02', '10:09', 'terminal', 1], ['10:09', '10:41', 'vscode', 1],
    ['10:55', '11:20', 'figma', 1], ['11:20', '11:26', 'wechat', 1], ['11:26', '12:08', 'figma', 1], ['12:08', '12:12', 'edge', 2],
    ['13:06', '13:15', 'wechat', 1], ['13:15', '13:48', 'excel', 1], ['13:48', '14:02', 'vscode', 2],
    ['14:05', '14:40', 'vscode', 2], ['14:40', '14:46', 'terminal', 2], ['14:46', '15:10', 'edge', 1], ['15:10', '15:18', 'feishu', 1], ['15:18', '15:42', 'vscode', 3],
  ];
  const r0 = rng(20261008);
  const segments = raw.map(([s, e, app, win], i) => {
    const start = toMin(s), end = toMin(e), len = end - start, [k, c] = rate[apps[app].kind];
    return { id: 'f' + i, type: 'focus', start, end, len, app, window: win, keys: Math.round(k * len * (0.8 + 0.4 * r0())), clicks: Math.round(c * len * (0.8 + 0.4 * r0())), live: i === raw.length - 1 };
  });
  const gaps = [
    { id: 'g0', type: 'gap', start: toMin('10:41'), end: toMin('10:55'), len: 14, label: '已暂停记录', reason: '你手动暂停', missing: '应用活动、键盘与鼠标计数' },
    { id: 'g1', type: 'gap', start: toMin('14:02'), end: toMin('14:05'), len: 3, label: '采集器重启', reason: '采集器意外退出后自动恢复', missing: '应用活动' },
  ];
  const away = [{ id: 'a0', type: 'away', start: toMin('12:12'), end: toMin('13:06'), len: 54, label: '锁屏', reason: '午休离开' }];
  const items = [...segments, ...gaps, ...away].sort((a, b) => a.start - b.start);

  Object.values(apps).forEach(a => { a.focus = 0; a.keys = 0; a.clicks = 0; a.sessions = 0; });
  segments.forEach(s => { const a = apps[s.app]; a.focus += s.len; a.keys += s.keys; a.clicks += s.clicks; a.sessions++; });
  const appList = Object.values(apps).sort((a, b) => b.focus - a.focus || b.open - a.open);
  const focusTotal = segments.reduce((t, s) => t + s.len, 0);
  const keysTotal = segments.reduce((t, s) => t + s.keys, 0);
  const clicksTotal = segments.reduce((t, s) => t + s.clicks, 0);
  const span = { start: segments[0].start, end: NOW };
  const coverage = 1 - gaps.reduce((t, g) => t + g.len, 0) / (span.end - span.start);

  const focusAt = m => segments.find(s => m >= s.start && m < s.end);
  const inRange = (list, a, b) => list.filter(x => x.end > a && x.start < b);
  const clipLen = (x, a, b) => Math.max(0, Math.min(x.end, b) - Math.max(x.start, a));

  /* five-minute input buckets */
  const r1 = rng(77);
  const input = [];
  for (let t = toMin('08:50'); t < NOW; t += 5) {
    let keys = 0, clicks = 0;
    for (let m = t; m < t + 5; m++) { const s = focusAt(m); if (s) { const [k, c] = rate[apps[s.app].kind]; keys += k * (0.5 + r1()); clicks += c * (0.5 + r1()); } }
    input.push({ t, keys: Math.round(keys), clicks: Math.round(clicks) });

  const inputMax = Math.max(...input.map(i => i.keys));

  /* focus minutes per hour per app */
  const hourly = [];
  for (let h = 8; h < 16; h++) {

    const r = cv.getBoundingClientRect(), k = cv.width / r.width, Z = 2.8, span = 190 / Z * k;

  });

function toggleMark(c) { const id = c.dataset.id; if (state.marked.has(id)) state.marked.delete(id); else state.marked.add(id); markFrame(c, state.marked.has(id)); const n = $('#markN'); if (n) n.textContent = state.marked.size; }
function openModal(id) {

  h += `<path class="histpath" d="${d}" fill="url(#hg)" stroke="var(--amber)" stroke-width="1.2"/>`;
  items.forEach(it => { h += `<rect x="${X(Math.max(it.start, x0))}" y="${it.type === 'away' ? B + 14 : B + 10}" width="${Math.max(1, X(it.end) - X(Math.max(it.start, x0)))}" height="${it.type === 'away' ? 4 : 12}" fill="${it.type === 'gap' ? 'var(--red)' : it.type === 'away' ? 'var(--line-2)' : col(it.app)}" class="histpath"/>`; });

  svg.addEventListener('pointermove', e => { const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * 900; const t = x0 + (vx - L) / (R - L) * (x1 - x0); const b = inp.find(q => t >= q.t && t < q.t + 5); if (!b) return; const c = $('#cross'); c.setAttribute('x1', vx); c.setAttribute('x2', vx); c.setAttribute('opacity', 1); const s = TL.focusAt(b.t + 2); $('#readout').innerHTML = `${hm(b.t)}–${hm(b.t + 5)}<br>${b.keys} 键 · ${b.clicks} 击${s ? ' · ' + apps[s.app].short : ''}`; });

    };

    $$('.chips', cb).forEach(g => g.addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) $$('.chip', g).forEach(x => x.setAttribute('aria-pressed', x === b)); }));
    const s = $('#send', cb); if (s) s.addEventListener('click', narrate);
    const t = $('#test', cb); if (t) t.addEventListener('click', () => toast('连接已验证，测试只发送了合成数据'));
  };

let tok = 0;
function narrate() {
  const a = $('#answer'); if (!a) return; const my = ++tok;
  a.innerHTML = `<div class="thinking"><span class="reel-spin"></span>正在冲洗 08:00–18:00 的聚合事实…</div>`;

}
function typeInto(host, paras, inline, my = ++tok) {
  host.innerHTML = ''; let pi = 0, ci = 0, p = null; const caret = document.createElement('span'); caret.className = 'caret';
  const step = () => {
    if (my !== tok) return; if (pi >= paras.length) { caret.remove(); return; }
    if (!p) { p = document.createElement(inline ? 'span' : 'p'); p.append(document.createTextNode(''), caret); host.appendChild(p); }
