[package]
name = "timelens-performance-validation"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webp = "0.3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "timelens-performance-suite"
path = "src/main.rs"

[[bin]]
name = "timelens-window-storm"
path = "src/window_storm.rs"
