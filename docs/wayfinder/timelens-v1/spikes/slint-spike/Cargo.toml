[package]
name = "timelens-slint-spike"
version = "0.0.0"
edition = "2024"
publish = false

[build-dependencies]
embed-resource = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.17.1", default-features = false, features = [
    "backend-winit",
    "compat-1-2",
    "renderer-software",
    "std",
] }
